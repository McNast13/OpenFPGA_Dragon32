name: Build core

# Builds the Analogue Pocket bitstream with Intel Quartus Prime in Docker
# (no local install needed - Quartus itself only runs on Windows/Linux, not
# macOS) and packages a ready-to-install release zip as a workflow artifact.
#
# Quartus version: pinned to 18.1, matching the sibling ../OpenFPGA_ZX-Spectrum
# project's workflow (though that one has no run history of its own to
# confirm against - this is templated from it, not proven by it). Revisit
# if the openFPGA template ever requires a newer Quartus IP generation.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space
        # The raetro/quartus image is large enough that pulling it fills
        # the default runner's disk outright ("no space left on device"
        # mid-pull) unless the preinstalled Android/.NET/GHC/CodeQL/Docker
        # image caches are cleared first.
        uses: jlumbroso/free-disk-space@main
        with:
          preinstalled-runtimes: true
          docker-images: false

      - name: Checkout
        uses: actions/checkout@v4

      - name: Compile with Quartus
        run: |
          docker run --rm \
            -v "$PWD:/build" -w /build/src/fpga \
            raetro/quartus:18.1 \
            bash -c 'quartus_sh --flow compile ap_core'

      - name: Convert RBF to bitstream.rbf_r
        run: |
          mkdir -p stage
          cp -r dist/Cores dist/Platforms dist/Assets stage/
          python3 tools/rbf_to_rbf_r.py \
            src/fpga/output_files/ap_core.rbf \
            stage/Cores/McNast13.Dragon32/bitstream.rbf_r

      - name: Package release zip
        run: |
          cd stage
          zip -r ../Dragon32-pocket-core.zip Cores Platforms Assets

      - name: Upload release zip
        uses: actions/upload-artifact@v4
        with:
          name: Dragon32-pocket-core
          path: Dragon32-pocket-core.zip
          if-no-files-found: error

      - name: Upload build reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quartus-reports
          path: |
            src/fpga/output_files/*.rpt
            src/fpga/output_files/*.summary
          if-no-files-found: warn
